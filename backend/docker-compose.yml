version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: c4p_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-connect4people}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-c4p_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-connect4people}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - c4p_network

  # Node.js API & Socket.io Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: c4p_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-connect4people}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-c4p_secure_pass_2026}
      DB_AUTO_SYNC: "true"
      JWT_SECRET: ${JWT_SECRET:-c4p_prod_jwt_super_secret_key_2026}
      JWT_EXPIRES_IN: 30d
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-connect4people-bucket}
      PLATFORM_COMMISSION_PERCENT: 20
      REGISTRATION_FEE_INR: 299
    ports:
      - "5000:5000"
    networks:
      - c4p_network

  # Nginx Reverse Proxy with WebSocket & SSL support
  nginx:
    image: nginx:alpine
    container_name: c4p_nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs_data:/etc/letsencrypt
    networks:
      - c4p_network

volumes:
  postgres_data:
  certs_data:

networks:
  c4p_network:
    driver: bridge
